<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход в мессенджер</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Наши стили -->
    <link href="/static/css/auth.css" rel="stylesheet">
</head>

<body>

<div class="login-container">
    <div class="card shadow-sm login-card">
        <div class="card-body p-4 p-md-5">

            <div class="login-title">Вход в мессенджер</div>
            <div class="login-subtitle">Введите данные своей учётной записи</div>

            <!-- Сообщение об ошибке -->
            <div id="error-box" class="alert alert-danger d-none" role="alert"></div>

            <!-- Форма авторизации -->
            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="example@mail.com"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Пароль</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Введите пароль"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary w-100" id="submit-btn">Войти</button>
            </form>

            <!-- Информация о регистрации -->
            <div class="login-footer">
                Регистрация новых пользователей осуществляется администратором системы.
            </div>

        </div>
    </div>
</div>

<!-- Наш скрипт -->
<script src="/static/js/auth.js"></script>

</body>
</html>
