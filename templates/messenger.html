<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мессенджер</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Наши стили -->
    <link href="/static/css/messenger.css" rel="stylesheet">
</head>

<body>

<div class="messenger" id="messenger">
    <!-- ==============================================
         LEFT SIDEBAR
         ============================================== -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <span>Мессенджер</span>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="logout-btn">Выйти</button>
            </div>

            <!-- SEARCH USERS -->
            <div class="search-wrapper">
                <label for="user-search" class="visually-hidden">Поиск</label>
                <input type="text" class="form-control" id="user-search" placeholder="Поиск пользователей..." autocomplete="off">
                <div class="search-results" id="search-results"></div>
            </div>
        </div>

        <!-- CHAT LIST -->
        <div class="chat-list" id="chat-list">
            <div class="chat-empty">Загрузка чатов...</div>
        </div>

        <!-- CREATE GROUP -->
        <div class="sidebar-footer">
            <button type="button" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#createGroupModal">
                Создать групповой чат
            </button>
        </div>
    </aside>

    <!-- ==============================================
         MAIN CONTENT
         ============================================== -->
    <main class="content">
        <!-- WELCOME -->
        <section class="welcome" id="welcome">
            <div class="welcome-content">
                <div class="welcome-icon">💬</div>
                <h1 class="h3 mb-3">Добро пожаловать</h1>
                <p class="mb-0">Выберите чат слева, чтобы начать общение.</p>
            </div>
        </section>

        <!-- CHAT WINDOW -->
        <section class="chat-window" id="chat-window">
            <header class="chat-header">
                <div class="avatar" id="chat-avatar">?</div>
                <div>
                    <div class="chat-header-name" id="chat-header-name"></div>
                    <div class="chat-header-type" id="chat-header-type"></div>
                </div>
            </header>

            <div class="messages" id="messages">
                <div class="messages-empty">Сообщения появятся здесь.</div>
            </div>

            <div class="message-input">
                <form id="message-form">
                    <div class="input-group">
                        <label for="message-input" class="visually-hidden">Сообщение</label>
                        <input type="text" class="form-control" id="message-input" placeholder="Введите сообщение..." disabled>
                        <button type="submit" class="btn btn-primary" disabled>Отправить</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>

<!-- ==============================================
     CREATE GROUP MODAL
     ============================================== -->
<div class="modal fade" id="createGroupModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="create-group-form">
                <div class="modal-header">
                    <h5 class="modal-title">Создание группового чата</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <div id="group-error" class="alert alert-danger d-none"></div>
                    <div class="mb-3">
                        <label for="group-name" class="form-label">Название</label>
                        <input type="text" class="form-control" id="group-name" maxlength="100" required>
                    </div>
                    <div class="mb-3">
                        <label for="group-description" class="form-label">Описание</label>
                        <textarea class="form-control" id="group-description" rows="3" maxlength="500"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary" id="create-group-submit">Создать</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Наш скрипт -->
<script src="/static/js/messenger.js"></script>

</body>
</html>
